openapi: 3.0.3
info:
  title: 异业联盟商城 API
  version: 0.1.0
  description: 消费者 / 商户 / 平台三端共用领域服务。金额单位为「分」，时间为 Asia/Shanghai。
paths:
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/categories/{id}/:
    get:
      operationId: v1_categories_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 类目.
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/products/:
    get:
      operationId: v1_products_list
      description: 消费者端商品浏览：只暴露在售商品。
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: merchant
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
          title: 商品类型
          enum:
          - PHYSICAL
          - SERVICE
        description: |-
          * `PHYSICAL` - 实物商品
          * `SERVICE` - 到店服务
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
  /api/v1/products/{id}/:
    get:
      operationId: v1_products_retrieve
      description: 消费者端商品浏览：只暴露在售商品。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 商品/服务.
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/merchants/:
    get:
      operationId: v1_merchants_list
      description: 消费者端门店浏览：只暴露营业中的商户。
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: district
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMerchantList'
          description: ''
  /api/v1/merchants/{id}/:
    get:
      operationId: v1_merchants_retrieve
      description: 消费者端门店浏览：只暴露营业中的商户。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 商户.
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
          description: ''
  /api/v1/orders/:
    get:
      operationId: v1_orders_list
      description: 当前登录用户的订单（列表 / 详情）。商户端与平台端后续按角色扩展。
      parameters:
      - in: query
        name: merchant
        schema:
          type: integer
      - in: query
        name: order_type
        schema:
          type: string
          title: 订单类型
          enum:
          - EXPRESS
          - PICKUP
          - SERVICE
        description: |-
          * `EXPRESS` - 快递配送
          * `PICKUP` - 到店自提
          * `SERVICE` - 到店服务
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: 主状态
          enum:
          - AFTER_SALE
          - CLOSED
          - COMPLETED
          - FULFILLING
          - PENDING_ACCEPT
          - PENDING_FULFILL
          - PENDING_PAYMENT
          - REFUNDED
          - REFUNDING
        description: |-
          * `PENDING_PAYMENT` - 待支付
          * `PENDING_ACCEPT` - 待接单
          * `PENDING_FULFILL` - 待履约
          * `FULFILLING` - 履约中
          * `COMPLETED` - 已完成
          * `AFTER_SALE` - 售后中
          * `REFUNDING` - 退款中
          * `REFUNDED` - 已退款
          * `CLOSED` - 已关闭
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderListList'
          description: ''
  /api/v1/orders/{id}/:
    get:
      operationId: v1_orders_retrieve
      description: 当前登录用户的订单（列表 / 详情）。商户端与平台端后续按角色扩展。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 订单.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/cart/:
    get:
      operationId: v1_cart_retrieve
      description: 当前用户购物车（单店）。
      tags:
      - cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeResponse'
          description: ''
  /api/v1/cart/items/:
    post:
      operationId: v1_cart_items_create
      description: 加入购物车；同商品同规格累加。
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemInputRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeResponse'
          description: ''
  /api/v1/cart/items/{id}/:
    patch:
      operationId: v1_cart_items_partial_update
      description: 修改数量/选中状态或移出购物车。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCartItemPatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCartItemPatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCartItemPatchRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeResponse'
          description: ''
    delete:
      operationId: v1_cart_items_destroy
      description: 修改数量/选中状态或移出购物车。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/wechat/login/:
    post:
      operationId: v1_auth_wechat_login_create
      description: 小程序登录：Mock 阶段 code 换 openid/unionid。
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WechatLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WechatLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeResponse'
          description: ''
  /api/v1/auth/h5/sms/:
    post:
      operationId: v1_auth_h5_sms_create
      description: H5 手机号验证码登录。
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SmsLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SmsLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeResponse'
          description: ''
  /api/v1/auth/sms/send/:
    post:
      operationId: v1_auth_sms_send_create
      description: 发送短信验证码；Mock 模式返回 debug_code。
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeResponse'
          description: ''
  /api/v1/addresses/:
    get:
      operationId: v1_addresses_retrieve
      description: 收货地址列表与新增。
      tags:
      - consumer
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeResponse'
          description: ''
    post:
      operationId: v1_addresses_create
      description: 收货地址列表与新增。
      tags:
      - consumer
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeResponse'
          description: ''
  /api/v1/addresses/{id}/:
    patch:
      operationId: v1_addresses_partial_update
      description: 收货地址修改与删除。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - consumer
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeResponse'
          description: ''
    delete:
      operationId: v1_addresses_destroy
      description: 收货地址修改与删除。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - consumer
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/auth/token/:
    post:
      operationId: v1_accounts_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/accounts/auth/refresh/:
    post:
      operationId: v1_accounts_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/accounts/me/:
    get:
      operationId: v1_accounts_me_retrieve
      description: 当前登录用户与所属商户身份。
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/accounts/staff/users/:
    get:
      operationId: v1_accounts_staff_users_retrieve
      description: 仅平台后台可用：用户列表（按手机号 / 昵称检索）。
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
          description: ''
components:
  schemas:
    AppUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
          title: 手机号
        nickname:
          type: string
          readOnly: true
          title: 昵称
        avatar_url:
          type: string
          format: uri
          readOnly: true
          title: 头像
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          readOnly: true
          title: 性别
        status:
          allOf:
          - $ref: '#/components/schemas/AppUserStatusEnum'
          readOnly: true
          title: 状态
        identities:
          type: array
          items:
            $ref: '#/components/schemas/UserIdentity'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
      required:
      - avatar_url
      - created_at
      - gender
      - id
      - identities
      - nickname
      - phone
      - status
    AppUserStatusEnum:
      enum:
      - ACTIVE
      - DISABLED
      type: string
      description: |-
        * `ACTIVE` - 正常
        * `DISABLED` - 禁用
    Appointment:
      type: object
      properties:
        slot_id:
          type: integer
          nullable: true
          title: 时段
          readOnly: true
        slot_date:
          type: string
          format: date
          title: 预约日期
        start_time:
          type: string
          format: time
          title: 开始时间
        end_time:
          type: string
          format: time
          title: 结束时间
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatusEnum'
          title: 状态
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          title: 确认时间
        remark:
          type: string
          title: 备注
          maxLength: 120
      required:
      - end_time
      - slot_date
      - slot_id
      - start_time
    AppointmentStatusEnum:
      enum:
      - PENDING_CONFIRM
      - CONFIRMED
      - COMPLETED
      - CANCELLED
      - NO_SHOW
      type: string
      description: |-
        * `PENDING_CONFIRM` - 待确认
        * `CONFIRMED` - 已确认
        * `COMPLETED` - 已完成
        * `CANCELLED` - 已取消
        * `NO_SHOW` - 爽约
    CartItemInputRequest:
      type: object
      properties:
        product_id:
          type: integer
          minimum: 1
        sku_id:
          type: integer
          minimum: 1
          nullable: true
        quantity:
          type: integer
          maximum: 99
          minimum: 1
          default: 1
      required:
      - product_id
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        parent:
          type: integer
          nullable: true
          title: 上级类目
        name:
          type: string
          title: 类目名
          maxLength: 40
        icon_url:
          type: string
          format: uri
          title: 图标
          maxLength: 200
        level:
          type: integer
          title: 层级
        sort:
          type: integer
          title: 排序
      required:
      - id
      - name
    EnvelopeResponse:
      type: object
      description: 仅用于 OpenAPI 快照描述统一响应结构。
      properties:
        code:
          type: string
        message:
          type: string
        trace_id:
          type: string
        data:
          nullable: true
      required:
      - code
      - message
      - trace_id
    FulfillmentStatusEnum:
      enum:
      - NOT_STARTED
      - APPOINTMENT_CONFIRMED
      - SHIPPED
      - PICKUP_READY
      - VERIFY_READY
      - DONE
      type: string
      description: |-
        * `NOT_STARTED` - 未开始
        * `APPOINTMENT_CONFIRMED` - 预约已确认
        * `SHIPPED` - 已发货
        * `PICKUP_READY` - 待自提
        * `VERIFY_READY` - 待核销
        * `DONE` - 已履约
    GenderEnum:
      enum:
      - U
      - M
      - F
      type: string
      description: |-
        * `U` - 未知
        * `M` - 男
        * `F` - 女
    Health:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        time:
          type: string
        db:
          type: string
      required:
      - db
      - service
      - status
      - time
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
          title: 手机号
        nickname:
          type: string
          readOnly: true
          title: 昵称
        avatar_url:
          type: string
          format: uri
          readOnly: true
          title: 头像
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          readOnly: true
          title: 性别
        status:
          allOf:
          - $ref: '#/components/schemas/AppUserStatusEnum'
          readOnly: true
          title: 状态
        identities:
          type: array
          items:
            $ref: '#/components/schemas/UserIdentity'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
        merchant_roles:
          type: array
          items:
            $ref: '#/components/schemas/MerchantRole'
          readOnly: true
        is_staff:
          type: boolean
      required:
      - avatar_url
      - created_at
      - gender
      - id
      - identities
      - is_staff
      - merchant_roles
      - nickname
      - phone
      - status
    Merchant:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        merchant_no:
          type: string
          title: 商户编号
          maxLength: 32
        name:
          type: string
          title: 商户名称
          maxLength: 80
        short_name:
          type: string
          title: 简称
          maxLength: 40
        category_id:
          type: integer
          nullable: true
          title: 主营类目
          readOnly: true
        category_name:
          type: string
          readOnly: true
          default: ''
        logo_url:
          type: string
          format: uri
          title: Logo
          maxLength: 200
        description:
          type: string
          title: 简介
        contact_phone:
          type: string
          title: 联系电话
          maxLength: 20
        city:
          type: string
          title: 市
          maxLength: 32
        district:
          type: string
          title: 区县
          maxLength: 32
        address:
          type: string
          title: 详细地址
          maxLength: 200
        lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          title: 经度
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          title: 纬度
        business_hours:
          title: 营业时间
        status:
          allOf:
          - $ref: '#/components/schemas/MerchantStatusEnum'
          title: 状态
        opened_at:
          type: string
          format: date-time
          nullable: true
